name: Drift

# Every PR (human or AI-authored) gets one sticky comment listing new design drift,
# plus a soft "Drift / design decisions" status that links into the Drift review.
# Nothing fails: the status stays pending until each change has a decision.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  design-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # Drift diffs the branch against its merge base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/drift.ts --pr --base origin/${{ github.base_ref }}
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRIFT_URL: ${{ vars.DRIFT_URL || 'http://localhost:3000/drift' }}
